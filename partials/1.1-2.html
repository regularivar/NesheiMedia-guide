<div id="diskModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;align-items:center;justify-content:center" onclick="if(event.target===this)closeDiskModal()">
            <div style="background:#11141a;border:1px solid #252d3d;border-radius:14px;padding:28px;width:460px;max-width:95vw;max-height:85vh;overflow-y:auto">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
                <span style="font-family:var(--sans);font-weight:700;font-size:16px;color:var(--text)">✏️ Oppdater diskbruk</span>
                <button onclick="closeDiskModal()" style="background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer">✕</button>
              </div>
              <div style="display:flex;flex-direction:column;gap:12px" id="diskInputs">
                <div class="disk-input-row" data-disk="0" data-color="#4f8ef7">
                  <label style="font-family:var(--mono);font-size:11px;color:var(--text3);display:block;margin-bottom:4px">🗄️ HDD #1 – 14 TB (V: + Y:)</label>
                  <div style="display:flex;gap:8px;align-items:center">
                    <input type="number" min="0" max="100" value="50" style="width:70px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:13px;padding:6px 10px;border-radius:6px" oninput="previewDisk(0,this.value,&#x27;#4f8ef7&#x27;)">
                    <span style="font-family:var(--mono);font-size:12px;color:var(--text2)">% brukt</span>
                    <input type="text" placeholder="~2,6 TB" style="flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:12px;padding:6px 10px;border-radius:6px" id="label0">
                  </div>
                </div>
                <div class="disk-input-row" data-disk="1" data-color="#c084fc">
                  <label style="font-family:var(--mono);font-size:11px;color:var(--text3);display:block;margin-bottom:4px">🗄️ HDD #2 – 6 TB (U: + T:)</label>
                  <div style="display:flex;gap:8px;align-items:center">
                    <input type="number" min="0" max="100" value="70" style="width:70px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:13px;padding:6px 10px;border-radius:6px" oninput="previewDisk(1,this.value,&#x27;#c084fc&#x27;)">
                    <span style="font-family:var(--mono);font-size:12px;color:var(--text2)">% brukt</span>
                    <input type="text" placeholder="~4,2 TB" style="flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:12px;padding:6px 10px;border-radius:6px" id="label1">
                  </div>
                </div>
                <div class="disk-input-row" data-disk="2" data-color="#fbbf24">
                  <label style="font-family:var(--mono);font-size:11px;color:var(--text3);display:block;margin-bottom:4px">🗄️ HDD #3 – 8 TB (K:)</label>
                  <div style="display:flex;gap:8px;align-items:center">
                    <input type="number" min="0" max="100" value="13" style="width:70px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:13px;padding:6px 10px;border-radius:6px" oninput="previewDisk(2,this.value,&#x27;#fbbf24&#x27;)">
                    <span style="font-family:var(--mono);font-size:12px;color:var(--text2)">% brukt</span>
                    <input type="text" placeholder="~1,1 TB" style="flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:12px;padding:6px 10px;border-radius:6px" id="label2">
                  </div>
                </div>
                <div class="disk-input-row" data-disk="3" data-color="#fb923c">
                  <label style="font-family:var(--mono);font-size:11px;color:var(--text3);display:block;margin-bottom:4px">🗄️ HDD #4 – 8 TB (W: + O:)</label>
                  <div style="display:flex;gap:8px;align-items:center">
                    <input type="number" min="0" max="100" value="36" style="width:70px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:13px;padding:6px 10px;border-radius:6px" oninput="previewDisk(3,this.value,&#x27;#fb923c&#x27;)">
                    <span style="font-family:var(--mono);font-size:12px;color:var(--text2)">% brukt</span>
                    <input type="text" placeholder="~2,87 TB" style="flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:12px;padding:6px 10px;border-radius:6px" id="label3">
                  </div>
                </div>
                <div class="disk-input-row" data-disk="4" data-color="#22d3ee">
                  <label style="font-family:var(--mono);font-size:11px;color:var(--text3);display:block;margin-bottom:4px">⚡ NVMe SSD – 2 TB (P:)</label>
                  <div style="display:flex;gap:8px;align-items:center">
                    <input type="number" min="0" max="100" value="19" style="width:70px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:13px;padding:6px 10px;border-radius:6px" oninput="previewDisk(4,this.value,&#x27;#22d3ee&#x27;)">
                    <span style="font-family:var(--mono);font-size:12px;color:var(--text2)">% brukt</span>
                    <input type="text" placeholder="~378 GB" style="flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:12px;padding:6px 10px;border-radius:6px" id="label4">
                  </div>
                </div>
                <div class="disk-input-row" data-disk="5" data-color="#f472b6">
                  <label style="font-family:var(--mono);font-size:11px;color:var(--text3);display:block;margin-bottom:4px">⚡ NVMe Cache – 1 TB (F:)</label>
                  <div style="display:flex;gap:8px;align-items:center">
                    <input type="number" min="0" max="100" value="5" style="width:70px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:13px;padding:6px 10px;border-radius:6px" oninput="previewDisk(5,this.value,&#x27;#f472b6&#x27;)">
                    <span style="font-family:var(--mono);font-size:12px;color:var(--text2)">% brukt</span>
                    <input type="text" placeholder="~48 GB" style="flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:12px;padding:6px 10px;border-radius:6px" id="label5">
                  </div>
                </div>
              </div>
              <div style="margin-top:20px;display:flex;gap:10px;justify-content:flex-end">
                <button onclick="closeDiskModal()" style="font-family:var(--mono);font-size:12px;background:none;border:1px solid var(--border);color:var(--text3);padding:8px 16px;border-radius:6px;cursor:pointer">Avbryt</button>
                <button onclick="saveDiskUsage()" style="font-family:var(--mono);font-size:12px;background:rgba(79,142,247,0.2);border:1px solid rgba(79,142,247,0.4);color:var(--accent2);padding:8px 16px;border-radius:6px;cursor:pointer">💾 Lagre</button>
              </div>
              <p style="font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:12px;text-align:center">Verdier lagres kun i denne nettleserøkten (ikke permanent)</p>
            </div>
          </div>
